replicaCount: 1

image:
  repository: registry.gitlab.com/amauryortega/ejemplo-php
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ejemplo-php.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_KEY: "base64:Q0hBTkdFX01FX1BMRUFTRQ=="
  DATABASE_URL: "mysql://root:secret@database:3306/backend_laravel"
  WAIT_HOSTS: "database:3306"
