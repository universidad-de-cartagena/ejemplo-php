apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s
  - ../../base

namePrefix: staging-

namespace: ejemplo-php

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: ejemplo-php
  - path: resource-limits.yaml
    target:
      kind: Deployment
      name: ejemplo-php

configMapGenerator:
  - name: ejemplo-php-env
    behavior: create
    literals:
      - ENVIRONMENT=staging
      - APP_ENV=staging
      - APP_DEBUG=false
      - LOG_LEVEL=info

generatorOptions:
  disableNameSuffixHash: true
